name: Verify Story Master
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:secrets && pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm prepare:functions
      - run: pnpm exec firebase setup:emulators:firestore && pnpm exec firebase setup:emulators:database && pnpm exec firebase setup:emulators:storage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm emulators:test
      - run: pnpm security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report
            test-results
