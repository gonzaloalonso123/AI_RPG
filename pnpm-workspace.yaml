packages:
  - apps/*
  - packages/*
  - functions

allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  re2: false

minimumReleaseAgeExclude:
  - "@firebase/ai@3.0.0"
  - "@firebase/app-compat@0.5.19"
  - "@firebase/app@0.16.3"
  - "@firebase/auth-compat@0.6.12"
  - "@firebase/auth@1.13.7"
  - "@firebase/firestore-compat@0.4.15"
  - "@firebase/firestore@4.18.0"
  - "@firebase/remote-config-compat@0.2.30"
  - "@firebase/remote-config@0.9.3"
  - "@firebase/rules-unit-testing@6.0.0"
  - "@firebase/storage-compat@0.4.6"
  - "@firebase/storage@0.14.6"
  - "@playwright/test@1.64.0"
  - firebase-tools@15.33.0
  - firebase@13.0.0
  - lucide-react@1.53.0
  - openai@7.30.1
  - playwright-core@1.64.0
  - playwright@1.64.0
  - vite@8.3.4

overrides:
  '@grpc/grpc-js@<1.13.6': 1.13.6
  'basic-ftp@<6.2.1': 6.2.1
  'uuid@>=9.0.0 <11.1.1': 11.1.1

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
